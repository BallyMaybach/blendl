<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7">
<title>Stammbaum Blendl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1 id="docTitle">Stammbaum Blendl</h1>
      <p id="docSubtitle">Familie Blendl seit ca. 1650</p>
    </div>
    <button class="icon-btn" id="btnMenu" aria-label="Menü">&#9776;</button>
  </div>
</header>

<main>
  <!-- ===== Stammbaum ===== -->
  <section class="view is-active" id="view-tree">
    <div class="tree-stage" id="stage">
      <div class="tree-canvas" id="canvas">
        <svg class="tree-lines" id="lines"></svg>
        <div class="tree-nodes" id="nodes"></div>
      </div>
    </div>
    <div class="zoom-controls">
      <button class="round-btn" id="btnZoomIn" aria-label="Größer">+</button>
      <button class="round-btn" id="btnZoomOut" aria-label="Kleiner">&minus;</button>
      <button class="round-btn" id="btnFit" aria-label="Alles zeigen">&#9744;</button>
    </div>
    <p class="hint" id="treeHint">Ziehen zum Bewegen &middot; zwei Finger zum Zoomen &middot; Person antippen</p>
  </section>

</main>


<!-- ===== Personen-Detail ===== -->
<div class="sheet-backdrop" id="backdrop" hidden></div>

<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog">
  <button class="sheet-grip" id="sheetClose" aria-label="Schließen"></button>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<!-- ===== Formular (Person bearbeiten) ===== -->
<section class="sheet" id="formSheet" hidden aria-modal="true" role="dialog">
  <button class="sheet-grip" id="formClose" aria-label="Schließen"></button>
  <div class="sheet-body">
    <h2 id="formTitle">Person bearbeiten</h2>
    <form id="personForm" autocomplete="off">
      <label>Name<input name="name" required placeholder="Vorname Nachname"></label>
      <label>Rolle / Beruf<input name="role" placeholder="z. B. 11. Generation"></label>
      <div class="row2">
        <label>Geboren<input name="born" placeholder="z. B. 8.10.1879"></label>
        <label>Gestorben<input name="died" placeholder="z. B. 10.6.1958"></label>
      </div>
      <label>Ort<input name="place" placeholder="z. B. Regensburg"></label>
      <label>Text / Erinnerungen<textarea name="notes" rows="6" placeholder="Was weiß man über diese Person?"></textarea></label>

      <div class="photo-field">
        <div class="photo-preview" id="photoPreview"></div>
        <div class="photo-actions">
          <label class="file-btn">Foto wählen<input type="file" id="photoInput" accept="image/*"></label>
          <button type="button" class="ghost-btn" id="photoRemove">Foto entfernen</button>
        </div>
      </div>

      <label id="sexField">Farbe / Geschlecht
        <select name="sex">
          <option value="m">männlich (blau)</option>
          <option value="w">weiblich (orange)</option>
        </select>
      </label>

      <fieldset id="relationFields">
        <legend>Verbindungen</legend>
        <label>Elternteil 1<select name="parent1"></select></label>
        <label>Elternteil 2<select name="parent2"></select></label>
        <label>Partner / Partnerin<select name="partner"></select></label>
      </fieldset>

      <div class="form-actions">
        <button type="submit" class="primary-btn">Speichern</button>
        <button type="button" class="danger-btn" id="btnDelete">Löschen</button>
      </div>
    </form>
  </div>
</section>

<!-- ===== Menü ===== -->
<section class="sheet" id="menuSheet" hidden aria-modal="true" role="dialog">
  <button class="sheet-grip" id="menuClose" aria-label="Schließen"></button>
  <div class="sheet-body">
    <h2>Menü</h2>
    <div class="menu-list">
      <button class="menu-item" id="btnAddPerson"><b>Person zum Stammbaum</b><small>Kind, Partner oder Elternteil ergänzen</small></button>
      <button class="menu-item" id="btnExport"><b>Sicherung speichern</b><small>Alles als Datei herunterladen</small></button>
      <label class="menu-item" for="importInput"><b>Sicherung laden</b><small>Datei vom Handy oder Computer einlesen</small></label>
      <input type="file" id="importInput" accept="application/json" hidden>
      <button class="menu-item" id="btnPrint"><b>Drucken / als PDF</b><small>Stammbaum und Texte ausdrucken</small></button>
      <button class="menu-item danger" id="btnReset"><b>Auf Original zurücksetzen</b><small>Alle eigenen Änderungen verwerfen</small></button>
    </div>
    <p class="storage-note" id="storageNote"></p>
  </div>
</section>

<div class="toast" id="toast" hidden></div>

<script src="data.js?v=3"></script>
<script src="script.js?v=4"></script>
</body>
</html>
